name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.19 is the floor declared in package.json engines (ESLint 10 needs
        # it); 24 is the current LTS. Testing both keeps the engines claim
        # honest rather than aspirational.
        node-version: [20.19, 24]
    name: test (node ${{ matrix.node-version }})
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved to
      # point at different code, a SHA cannot. Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Build runs even when the tests pass: it catches import and integration
      # breakage that a unit suite cannot see.
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-node${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
